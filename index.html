<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Sentence Fix v2.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(126,224,197,.25)}
html,body{margin:0;padding:0;background:#0e1117;color:#e8edf5;font-family:Trebuchet MS,Segoe UI,sans-serif}
body{min-height:100dvh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.ver{font-size:10px;color:#6e7b90;margin:0 0 8px}
header.app{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#7ee0c5,#8bb4ff);display:grid;place-items:center;font-weight:800;color:#0b1220}
h1{font-size:1.15rem;margin:0}.sub{color:#9aa6b8;font-size:.82rem}
.xp{border:1px solid #2a3344;border-radius:999px;padding:7px 12px;color:#ffd166}
.card{background:#171c26;border:1px solid #2a3344;border-radius:18px;padding:18px}
.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}
button{appearance:none;border:0;background:#2a3548;color:#e8edf5;border-radius:12px;padding:12px 14px;font:inherit;touch-action:manipulation}
button.primary{background:linear-gradient(135deg,#6ee7c3,#7eb6ff);color:#0b1220;font-weight:800}
button.ghost{background:transparent;border:1px solid #2a3344}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{width:100%;text-align:left;background:#232d3f}
.choice.correct{background:#173528}.choice.wrong{background:#3a1d24}
.sentence{font-size:1.12rem;line-height:1.45;background:#121826;border:1px dashed #334057;border-radius:14px;padding:14px 16px;margin:12px 0}
.hack{background:#1a1710;border:1px solid #5a4a20;border-radius:14px;padding:14px;color:#f0e2b8;line-height:1.45;margin:8px 0 14px}
.feedback{margin-top:12px;color:#9aa6b8;line-height:1.45}.feedback.good{color:#6ee7a8}.feedback.bad{color:#ff7a8a}
.bar{height:8px;background:#243044;border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar>i{display:block;height:100%;width:0;background:#7ee0c5}
.pill{display:inline-block;font-size:.72rem;padding:3px 8px;border-radius:999px;background:#243046;color:#7ee0c5;margin-bottom:8px}
.stat{color:#9aa6b8;font-size:.85rem}
</style></head><body>
<div class="wrap"><div class="ver">v2.2</div>
<header class="app"><div class="brand"><div class="logo">SF</div><div><h1>Sentence Fix</h1><div class="sub">Brain hacks • v2.2</div></div></div><div class="xp" id="xp">XP 0</div></header>
<section id="home" class="card"><span class="pill">Foundation first</span>
<p>Do not memorize a rewrite. Learn the test. Drill and quiz now use new lines.</p>
<button type="button" class="primary" style="width:100%;margin:8px 0" id="teachBtn">Teach me everything</button>
<button type="button" class="ghost" style="width:100%" id="drillBtn">Fresh concept drill</button>
<button type="button" class="ghost" style="width:100%;margin-top:8px" id="quizBtn">Graded check (10 new)</button>
<p class="stat" id="homeStats"></p></section>
<section id="play" class="card hidden"><div class="stat" id="meta"></div><div class="bar"><i id="bar"></i></div><div id="hackBox" class="hack"></div><div id="prompt" class="sentence"></div><div id="choices" class="choices"></div><div id="feed" class="feedback"></div>
<div class="row" style="margin-top:12px"><button type="button" class="ghost" id="homeBtn">Home</button><button type="button" class="primary" id="nextBtn" disabled>Next</button></div></section>
<section id="results" class="card hidden"><span class="pill">Check results</span><div id="finalScore" style="font-size:2.4rem;font-weight:800"></div><p id="finalMsg"></p><div id="missList"></div>
<div class="row" style="margin-top:16px"><button type="button" class="primary" id="retakeBtn">Again</button><button type="button" class="ghost" id="resHome">Home</button></div></section></div>
<script>
const STORE="sentenceFixSave_v3";
let save={xp:0,bestPct:0,quizzes:0};
try{const raw=localStorage.getItem(STORE);if(raw)save=Object.assign(save,JSON.parse(raw))}catch(e){}
let xp=save.xp||0;
const HACKS={
finish:"<b>Hack 1 \u2014 Finished thought.</b> Can this stand alone? Need someone/something + what they do.",
hang:"<b>Hack 2 \u2014 School names.</b> A hanger is a <b>subordinating conjunction</b> (because, when, if, although, after, since, while, unless). It starts a <b>dependent clause</b> that cannot stand alone. That is a fragment. A <b>conjunctive adverb</b> is different: however, therefore, consequently, then. Those do not make a fragment. They also are not FANBOYS.",
two:"<b>Hack 3 \u2014 Count the thoughts.</b> 0 finished = fragment. 1 finished (maybe with a hanger attached) can be legal. 2 finished must be joined legally.",
join:"<b>Hack 4 \u2014 Legal join.</b> Two finished thoughts: period, semicolon, or comma + FANBOYS (<b>F</b>or, <b>A</b>nd, <b>N</b>or, <b>B</b>ut, <b>O</b>r, <b>Y</b>et, <b>S</b>o). however / therefore / then are conjunctive adverbs, not FANBOYS.",
cover:"<b>Hack 5 \u2014 Cover the comma.</b> Both sides stand alone = splice. One side cannot stand alone = legal comma after a dependent clause."
};
const TOUR=[
{hack:"finish",prompt:"Can this stand alone?",line:"The locker at the end of the hall.",opts:[["Yes \u2014 finished","no"],["No \u2014 not finished","yes"]],why:"Thing named, no action. Fragment."},
{hack:"finish",prompt:"Can this stand alone?",line:"The alarm rang.",opts:[["Yes \u2014 finished","yes"],["No \u2014 not finished","no"]],why:"Something + action. Finished thought."},
{hack:"hang",prompt:"School name for Although?",line:"Although she studied for an hour.",opts:[["Subordinating conjunction","yes"],["Conjunctive adverb","no"],["FANBOYS word","no"]],why:"Although is a subordinating conjunction. It makes a dependent clause. Not however-style. Not FANBOYS."},
{hack:"hang",prompt:"How do you make this legal without new facts?",line:"Because the bus was late.",opts:[["Drop Because \u2192 The bus was late.","yes"],["Add a comma only","no"],["Leave it","no"]],why:"Drop the subordinating conjunction. The leftover words are already a sentence."},
{hack:"two",prompt:"How many finished thoughts?",line:"Maya finished her essay she submitted it before midnight.",opts:[["Zero","no"],["One","no"],["Two","yes"]],why:"Two finished thoughts, no mark = run-on."},
{hack:"two",prompt:"How many finished thoughts?",line:"After the final bell rang.",opts:[["Zero","yes"],["One","no"],["Two","no"]],why:"After is a subordinating conjunction. Zero finished thoughts. Fragment."},
{hack:"join",prompt:"What is legal between two finished thoughts?",line:"The dog barked ___ the cat hid.",opts:[["comma only","no"],["comma + and","yes"],["however after a comma","no"]],why:"and is the A in FANBOYS. however is a conjunctive adverb, not FANBOYS."},
{hack:"join",prompt:"Name this.",line:"The rain started we ran under the awning.",opts:[["Fragment","no"],["Run-on","yes"],["Comma splice","no"],["Correct","no"]],why:"Two finished thoughts. No mark. Run-on."},
{hack:"cover",prompt:"Cover the comma.",line:"Lila packed her bag, she forgot her charger.",opts:[["Both sides finished \u2192 splice","yes"],["Left side unfinished \u2192 legal comma","no"]],why:"Both sides stand alone. Comma only = splice."},
{hack:"cover",prompt:"Cover the comma.",line:"Although she studied, she still felt nervous.",opts:[["Both sides finished \u2192 splice","no"],["Left side unfinished \u2192 legal comma","yes"]],why:"Although she studied cannot stand alone. Legal complex sentence."},
{hack:"join",prompt:"School name for however?",line:"The library closes at six, however the lab stays open.",opts:[["Conjunctive adverb \u2014 still a splice here","yes"],["Subordinating conjunction","no"],["FANBOYS word","no"]],why:"however is a conjunctive adverb. It does not join with a comma. Still a splice."},
{hack:"join",prompt:"Name this.",line:"The library closes at six; the lab stays open.",opts:[["Run-on","no"],["Comma splice","no"],["Correct","yes"]],why:"A semicolon may join two finished thoughts."}
];
const FRESH=[
{hack:"finish",prompt:"Can this stand alone?",line:"A pile of notebooks on the third shelf.",opts:[["Yes \u2014 finished","no"],["No \u2014 not finished","yes"]],why:"Noun pile. No verb. Fragment."},
{hack:"finish",prompt:"Can this stand alone?",line:"Nico shut the laptop.",opts:[["Yes \u2014 finished","yes"],["No \u2014 not finished","no"]],why:"Nico + shut. Finished thought."},
{hack:"hang",prompt:"School name for Unless?",line:"Unless we leave now.",opts:[["Subordinating conjunction \u2014 fragment","yes"],["Conjunctive adverb","no"],["Correct sentence","no"]],why:"Unless starts a dependent clause. Cannot stand alone. Fragment."},
{hack:"hang",prompt:"School name for Since?",line:"Since the wifi dropped.",opts:[["Subordinating conjunction \u2014 fragment","yes"],["FANBOYS word","no"],["Finished sentence","no"]],why:"Since here means because. Subordinating conjunction. Fragment."},
{hack:"two",prompt:"How many finished thoughts?",line:"The bell rang students packed their bags.",opts:[["Zero","no"],["One","no"],["Two","yes"]],why:"The bell rang. Students packed their bags. Two finished thoughts, no mark = run-on."},
{hack:"two",prompt:"How many finished thoughts?",line:"Before the quiz started.",opts:[["Zero","yes"],["One","no"],["Two","no"]],why:"Before is a subordinating conjunction. Zero finished thoughts. Fragment."},
{hack:"join",prompt:"Name this.",line:"Turn in the form keep a copy for yourself.",opts:[["Fragment","no"],["Run-on","yes"],["Correct","no"]],why:"Two commands, each finished. No mark. Run-on."},
{hack:"cover",prompt:"Cover the comma.",line:"The cafeteria was closed, we ate outside.",opts:[["Both sides finished \u2192 splice","yes"],["Left side unfinished \u2192 legal comma","no"]],why:"The cafeteria was closed. We ate outside. Comma only = splice."},
{hack:"cover",prompt:"Cover the comma.",line:"If the rain stops, we will walk home.",opts:[["Both sides finished \u2192 splice","no"],["Left side unfinished \u2192 legal comma","yes"]],why:"If the rain stops cannot stand alone. Legal complex sentence."},
{hack:"join",prompt:"Name this.",line:"The homework is due tomorrow, therefore I am starting now.",opts:[["Correct","no"],["Comma splice","yes"],["Fragment","no"]],why:"therefore is a conjunctive adverb, not FANBOYS. Two finished thoughts + comma = splice."},
{hack:"join",prompt:"Name this.",line:"Nico wanted pizza, yet the shop was closed.",opts:[["Comma splice","no"],["Run-on","no"],["Correct","yes"]],why:"yet is the Y in FANBOYS (For, And, Nor, But, Or, Yet, So). Comma + yet is legal."},
{hack:"join",prompt:"Name this.",line:"The gym was locked; however, we practiced outside.",opts:[["Comma splice","no"],["Correct","yes"],["Fragment","no"]],why:"Semicolon + conjunctive adverb however is legal. A comma before however would be a splice."}
];
let deck=[],i=0,mode="tour",locked=false,score=0,miss=[];
function $(id){return document.getElementById(id)}
function show(id){["home","play","results"].forEach(s=>$(s).classList.add("hidden"));$(id).classList.remove("hidden")}
function persist(){save.xp=xp;try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}$("xp").textContent="XP "+xp;const el=$("homeStats");if(el)el.textContent=save.quizzes?"Best check: "+save.bestPct+"%":"XP saves on this phone."}
function addXP(n){xp+=n;persist()}
function shuffle(a){const arr=a.slice();for(let x=arr.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[arr[x],arr[j]]=[arr[j],arr[x]]}return arr}
function start(which){mode=which;i=0;score=0;miss=[];locked=false;deck=which==="tour"?TOUR.slice():which==="quiz"?shuffle(FRESH).slice(0,10):shuffle(FRESH);show("play");render()}
function render(){const q=deck[i];$("meta").textContent=(mode==="tour"?"Hack tour ":"Q ")+(i+1)+" / "+deck.length;$("bar").style.width=(i/deck.length*100)+"%";$("hackBox").innerHTML=HACKS[q.hack];$("prompt").innerHTML="<b>"+q.prompt+"</b><br>"+q.line;$("feed").textContent="";$("feed").className="feedback";$("nextBtn").disabled=true;locked=false;$("nextBtn").textContent=i===deck.length-1?(mode==="quiz"?"See score":"Done"):"Next";const box=$("choices");box.innerHTML="";q.opts.forEach(function(pair){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=pair[0];b.onclick=function(){grade(q,pair[1]==="yes",b)};box.appendChild(b)})}
function grade(q,good,btn){if(locked)return;locked=true;if(good){btn.classList.add("correct");$("feed").textContent=q.why;$("feed").className="feedback good";addXP(mode==="quiz"?15:10);if(mode==="quiz")score++}else{btn.classList.add("wrong");[].forEach.call($("choices").children,function(b,idx){if(q.opts[idx][1]==="yes")b.classList.add("correct")});$("feed").textContent=q.why;$("feed").className="feedback bad";addXP(2);if(mode==="quiz")miss.push({line:q.line,why:q.why})}$("nextBtn").disabled=false}
function next(){if(i<deck.length-1){i++;render()}else if(mode==="quiz")finish();else{$("bar").style.width="100%";show("home");persist()}}
function finish(){const pct=Math.round(score/deck.length*100);let letter="F";if(pct>=90)letter="A";else if(pct>=80)letter="B";else if(pct>=70)letter="C";else if(pct>=60)letter="D";$("finalScore").textContent=pct+"%  "+letter;$("finalMsg").textContent=score+" / "+deck.length+" new-line checks.";$("missList").innerHTML=miss.length?miss.map(function(m){return "<p><b>"+m.line+"</b><br>"+m.why+"</p>"}).join(""):"<p>No misses.</p>";addXP(pct>=70?40:10);save.quizzes=(save.quizzes||0)+1;if(pct>(save.bestPct||0))save.bestPct=pct;persist();show("results")}
$("teachBtn").onclick=function(){start("tour")};
$("drillBtn").onclick=function(){start("drill")};
$("quizBtn").onclick=function(){start("quiz")};
$("homeBtn").onclick=function(){show("home")};
$("nextBtn").onclick=next;
$("retakeBtn").onclick=function(){start("quiz")};
$("resHome").onclick=function(){show("home")};
persist();
</script></body></html>
