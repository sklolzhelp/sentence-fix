<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Sentence Fix v1.2</title>
<style>
:root{--bg:#0e1117;--panel:#171c26;--panel2:#1e2533;--line:#2a3344;--text:#e8edf5;--muted:#9aa6b8;--accent:#7ee0c5;--accent2:#8bb4ff;--gold:#ffd166;--good:#6ee7a8;--bad:#ff7a8a;--radius:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(126,224,197,.25)}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Trebuchet MS,Segoe UI,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:radial-gradient(900px 400px at 10% -10%,#1b3a3a 0%,transparent 50%),var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.ver{font-size:10px;line-height:1;letter-spacing:.5px;color:#6e7b90;margin:0 0 8px}
header.app{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#0b1220}
h1{font-size:1.15rem;margin:0}.sub{color:var(--muted);font-size:.82rem}
.xp{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--gold)}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}
button{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;background:#2a3548;color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;touch-action:manipulation}
button.primary{background:linear-gradient(135deg,#6ee7c3,#7eb6ff);color:#0b1220;font-weight:800}
button.ghost{background:transparent;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.tile{text-align:left;padding:16px;border-radius:16px;background:#202838;border:2px solid var(--line)}
.tile b{display:block;margin-bottom:4px}.tile span{color:var(--muted);font-size:.86rem;display:block}
.tile.on{background:#16352f;border-color:var(--accent)}.tile.on b::after{content:"  \2713 selected";color:var(--accent);font-size:.8rem}
.pill{display:inline-block;font-size:.72rem;padding:3px 8px;border-radius:999px;background:#243046;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
.sentence{font-size:1.15rem;line-height:1.45;background:#121826;border:1px dashed #334057;border-radius:14px;padding:14px 16px;margin:12px 0 16px}
.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;background:#232d3f;border:1px solid #334057}
.choice.correct{background:#173528;border-color:#2f7a55}.choice.wrong{background:#3a1d24;border-color:#8a3a48}
.feedback{min-height:40px;margin-top:12px;color:var(--muted)}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.bar{height:8px;background:#243044;border-radius:99px;overflow:hidden;margin:8px 0 14px}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stat,.hint,.persist,footer.note{color:var(--muted);font-size:.85rem}
.score-big{font-size:3rem;font-weight:800}.ex{background:#121826;border-left:3px solid var(--accent);padding:10px 12px;margin:8px 0 14px}
.hack-btn{margin-top:10px;width:100%;background:#2a2416;border:1px solid #6b5420;color:var(--gold);font-weight:700}
.hack-box{display:none;margin-top:10px;padding:12px;background:#1a1710;border:1px solid #5a4a20;border-radius:12px;color:#f0e2b8}.hack-box.open{display:block}
h3{margin:16px 0 8px;font-size:.95rem;color:var(--accent2)}
</style></head><body>
<div class="wrap">
<div class="ver">v1.2</div>
<header class="app"><div class="brand"><div class="logo">SF</div><div><h1>Sentence Fix</h1><div class="sub">7th grade • v1.2</div></div></div><div class="xp" id="xp">XP 0</div></header>
<section id="home" class="card">
<span class="pill">How do you want to learn?</span>
<p>Spot fragments, run-ons, and comma splices.</p>
<p class="hint" id="styleNow">Selected style: Label it</p>
<div class="grid2" id="styleGrid">
<button type="button" class="tile on" data-style="label"><b>Label it</b><span>Name the error.</span></button>
<button type="button" class="tile" data-style="fix"><b>Fix it</b><span>Pick a legal version, or Already correct.</span></button>
<button type="button" class="tile" data-style="ear"><b>Use your ear</b><span>Finished or broken?</span></button>
<button type="button" class="tile" data-style="sort"><b>Sort bins</b><span>Tap the bucket.</span></button>
</div>
<h3>Topic</h3>
<div class="grid2" id="topicGrid">
<button type="button" class="tile" data-topic="fragment"><b>Fragments</b><span>Unfinished thought.</span></button>
<button type="button" class="tile" data-topic="runon"><b>Run-ons</b><span>Two sentences, no break.</span></button>
<button type="button" class="tile" data-topic="splice"><b>Comma splices</b><span>Only a comma.</span></button>
<button type="button" class="tile" data-topic="mix"><b>Mixed</b><span>All three.</span></button>
</div>
<button type="button" class="primary" style="width:100%;margin-top:14px" id="quizBtn">Graded quiz</button>
<p class="persist" id="homeStats"></p>
</section>
<section id="learn" class="card hidden"><div class="stat" id="learnMeta"></div><div class="bar"><i id="learnBar"></i></div><div id="lessonBox"></div><div id="learnPrompt" class="sentence"></div><div id="learnChoices" class="choices"></div><div id="learnFeed" class="feedback"></div>
<button type="button" class="hack-btn hidden" id="learnHackBtn">Want to know a hack?</button><div class="hack-box" id="learnHackBox"></div>
<div class="row" style="margin-top:12px"><button type="button" class="ghost" id="learnHome">Home</button><button type="button" class="primary" id="learnNext" disabled>Next</button></div></section>
<section id="quiz" class="card hidden"><div class="stat" id="quizMeta"></div><div class="bar"><i id="quizBar"></i></div><div id="quizPrompt" class="sentence"></div><div id="quizChoices" class="choices"></div><div id="quizFeed" class="feedback"></div>
<button type="button" class="hack-btn hidden" id="quizHackBtn">Want to know a hack?</button><div class="hack-box" id="quizHackBox"></div>
<div class="row" style="margin-top:12px"><button type="button" class="ghost" id="quizQuit">Quit</button><button type="button" class="primary" id="quizNext" disabled>Next</button></div></section>
<section id="results" class="card hidden"><span class="pill">Quiz results</span><div class="score-big" id="finalScore"></div><p id="finalMsg"></p><div id="missList"></div>
<div class="row" style="margin-top:16px"><button type="button" class="primary" id="retakeBtn">New quiz</button><button type="button" class="ghost" id="resultsHome">Home</button></div></section>
<footer class="note">sklolzhelp.github.io/sentence-fix • v1.2</footer></div>
<script>
const APP_VERSION="v1.2";
const ITEMS=[{q:"Because the bus was late.",type:"F",why:"Because-clause never finishes.",fix:"Because the bus was late, we missed warm-ups."},{q:"Running down the sideline with the ball.",type:"F",why:"No subject doing a complete action.",fix:"Jordan was running down the sideline with the ball."},{q:"When the teacher asked for volunteers.",type:"F",why:"When-clause hanging.",fix:"When the teacher asked for volunteers, Maya raised her hand."},{q:"After the final bell rang.",type:"F",why:"Dependent clause only.",fix:"After the final bell rang, the hallway filled with noise."},{q:"The locker at the end of the hall.",type:"F",why:"Thing named, no verb.",fix:"The locker at the end of the hall is jammed."},{q:"Which made the whole class laugh.",type:"F",why:"Which-clause floating.",fix:"The joke was unexpected, which made the whole class laugh."},{q:"Especially on Friday afternoons.",type:"F",why:"Extra detail, not a sentence.",fix:"The lab is packed, especially on Friday afternoons."},{q:"If we finish the project tonight.",type:"F",why:"If needs a result.",fix:"If we finish the project tonight, we can rest tomorrow."},{q:"Although she studied for an hour.",type:"F",why:"Although needs a main clause.",fix:"Although she studied for an hour, she still felt nervous."},{q:"Walking to the cafeteria after science.",type:"F",why:"-ing phrase, no subject+verb pair.",fix:"We were walking to the cafeteria after science."},{q:"Maya finished her essay she submitted it before midnight.",type:"RO",why:"Two sentences, no punctuation.",fix:"Maya finished her essay. She submitted it before midnight."},{q:"I wanted to stay I had homework.",type:"RO",why:"Two ideas smashed together.",fix:"I wanted to stay, but I had homework."},{q:"The movie ended everyone stayed for the credits.",type:"RO",why:"Needs a break after ended.",fix:"The movie ended, but everyone stayed for the credits."},{q:"He didn't hear the announcement he missed the deadline.",type:"RO",why:"Fused sentences.",fix:"He didn't hear the announcement, so he missed the deadline."},{q:"The rain started we ran under the awning.",type:"RO",why:"No mark between clauses.",fix:"The rain started. We ran under the awning."},{q:"Jordan likes soccer his brother prefers baseball.",type:"RO",why:"Two subject-verb pairs, no break.",fix:"Jordan likes soccer. His brother prefers baseball."},{q:"The alarm rang nobody moved.",type:"RO",why:"Fused.",fix:"The alarm rang, but nobody moved."},{q:"Sam opened the app the page would not load.",type:"RO",why:"Two sentences glued.",fix:"Sam opened the app, but the page would not load."},{q:"The storm knocked out power, we used flashlights.",type:"CS",why:"Comma alone cannot join sentences.",fix:"The storm knocked out power, so we used flashlights."},{q:"The recipe looked simple, it took two hours.",type:"CS",why:"Comma splice.",fix:"The recipe looked simple, but it took two hours."},{q:"Lila packed her bag, she forgot her charger.",type:"CS",why:"Two sentences, only a comma.",fix:"Lila packed her bag, but she forgot her charger."},{q:"The library closes at six, however the lab stays open.",type:"CS",why:"However is not FANBOYS.",fix:"The library closes at six; however, the lab stays open."},{q:"I like tacos, they are easy to make.",type:"CS",why:"Comma splice.",fix:"I like tacos. They are easy to make."},{q:"She practiced every day, her serve got stronger.",type:"CS",why:"Need and/so/period.",fix:"She practiced every day, so her serve got stronger."},{q:"Mom called twice, I still missed it.",type:"CS",why:"Comma only.",fix:"Mom called twice, but I still missed it."},{q:"Dinner is ready, come to the table.",type:"CS",why:"Two sentences joined by a comma.",fix:"Dinner is ready. Come to the table."},{q:"After the final bell rang, the hallway filled with noise.",type:"C",why:"Dependent clause + complete sentence.",fix:"After the final bell rang, the hallway filled with noise."},{q:"Jordan likes soccer. His brother prefers baseball.",type:"C",why:"Two clean sentences.",fix:"Jordan likes soccer. His brother prefers baseball."},{q:"The dog barked, and the cat hid under the couch.",type:"C",why:"Comma + and (FANBOYS) is legal.",fix:"The dog barked, and the cat hid under the couch."},{q:"Although she studied, she still felt nervous.",type:"C",why:"Although attached to a full sentence.",fix:"Although she studied, she still felt nervous."},{q:"We can leave now, or we can wait for Sam.",type:"C",why:"Comma + or.",fix:"We can leave now, or we can wait for Sam."},{q:"Because the bus was late, we missed warm-ups.",type:"C",why:"Because plus a result.",fix:"Because the bus was late, we missed warm-ups."},{q:"She packed her bag, but she forgot her charger.",type:"C",why:"Comma + but.",fix:"She packed her bag, but she forgot her charger."},{q:"The library closes at six; the lab stays open.",type:"C",why:"Semicolon joins two sentences.",fix:"The library closes at six; the lab stays open."}];
const LESSONS={fragment:{title:"Fragments",html:"<p>A <b>fragment</b> is missing a subject, a verb, or a finished thought.</p>"},runon:{title:"Run-ons",html:"<p>A <b>run-on</b> slams two complete sentences together with <b>no</b> punctuation.</p>"},splice:{title:"Comma splices",html:"<p>A <b>comma splice</b> joins two sentences with <b>only a comma</b>.</p>"},mix:{title:"Mixed",html:"<p>F fragment • RO run-on • CS comma splice • C correct</p>"}};
const LABEL={F:"Fragment",RO:"Run-on",CS:"Comma splice",C:"Correct"};
const HACKS={F:"<b>Hack:</b> If it feels unfinished, it is a fragment.",RO:"<b>Hack:</b> Two spots that could take a period with nothing between = run-on.",CS:"<b>Hack:</b> Cover the comma. If both sides are full sentences, the comma alone is illegal.",C:"<b>Hack:</b> Legal: period, semicolon, or comma + FANBOYS."};
const STORE="sentenceFixSave_v2";
let save={xp:0,bestPct:0,quizzes:0};try{const raw=localStorage.getItem(STORE);if(raw)save=Object.assign(save,JSON.parse(raw));}catch(e){}
let xp=save.xp||0,style="label",learnItems=[],learnI=0,learnMode="fragment",answered=false,quizItems=[],quizI=0,quizScore=0,quizMiss=[],quizAnswered=false;
function $(id){return document.getElementById(id)}
function show(id){["home","learn","quiz","results"].forEach(s=>$(s).classList.add("hidden"));$(id).classList.remove("hidden")}
function shuffle(a){const arr=a.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function persist(){save.xp=xp;try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}$("xp").textContent="XP "+xp;const el=$("homeStats");if(el)el.textContent=save.quizzes?"Best quiz: "+save.bestPct+"% • Quizzes: "+save.quizzes:"XP saves on this phone."}
function addXP(n){xp+=n;persist()}
function goHome(){persist();show("home")}
function styleName(){return {label:"Label it",fix:"Fix it",ear:"Use your ear",sort:"Sort bins"}[style]}
function pickStyle(s){style=s;document.querySelectorAll("#styleGrid .tile").forEach(t=>t.classList.toggle("on",t.getAttribute("data-style")===s));$("styleNow").textContent="Selected style: "+styleName()}
function toggleHack(w){$(w+"HackBox").classList.toggle("open")}
function showHack(w,t){$(w+"HackBtn").classList.remove("hidden");$(w+"HackBox").className="hack-box";$(w+"HackBox").innerHTML=HACKS[t]}
function hideHack(w){$(w+"HackBtn").classList.add("hidden");$(w+"HackBox").className="hack-box";$(w+"HackBox").innerHTML=""}
function byType(t){return ITEMS.filter(i=>i.type===t)}
function poolFor(topic){if(topic==="mix")return ITEMS.slice();return byType(topic==="fragment"?"F":topic==="runon"?"RO":"CS").concat(byType("C"))}
function distractorFixes(item){const others=shuffle(ITEMS.filter(i=>i.fix!==item.fix&&i.fix!==item.q&&i.type!=="C")).slice(0,2).map(i=>i.fix);return shuffle([item.fix].concat(others))}
function explain(item){return item.type==="C"?item.why+" Already correct — no change needed.":item.why+" Legal version: "+item.fix}
function startLearn(mode){learnMode=mode;answered=false;learnItems=shuffle(poolFor(mode)).slice(0,8);learnI=0;$("lessonBox").innerHTML="<h2 style='margin:0 0 6px'>"+LESSONS[mode].title+"</h2>"+LESSONS[mode].html+"<p class='hint'>Style: "+styleName()+"</p>";show("learn");renderLearn()}
function renderLearn(){const item=learnItems[learnI];$("learnMeta").textContent="Round "+(learnI+1)+" of "+learnItems.length;$("learnBar").style.width=(learnI/learnItems.length*100)+"%";$("learnFeed").textContent="";$("learnFeed").className="feedback";hideHack("learn");$("learnNext").disabled=true;answered=false;fillPromptChoices("learn",item,style)}
function fillPromptChoices(where,item,mode){const prompt=$(where+"Prompt");const box=$(where+"Choices");box.innerHTML="";if(mode==="fix"){prompt.textContent=item.q;const already="Already correct";if(item.type==="C"){const fakes=shuffle(ITEMS.filter(i=>i.type!=="C"&&i.fix!==item.q)).slice(0,2);shuffle([already,fakes[0].fix,fakes[1].fix]).forEach(function(txt){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=txt;b.addEventListener("click",function(){grade(where,item,txt===already,b,"fix")});box.appendChild(b)})}else{distractorFixes(item).forEach(function(txt){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=txt;b.addEventListener("click",function(){grade(where,item,txt===item.fix,b,"fix")});box.appendChild(b)})}}else if(mode==="ear"){prompt.textContent=item.q;const opts=item.type==="C"?[["Sounds finished / legal","ok"],["Sounds broken","bad"]]:[["Sounds finished / legal","bad"],["Sounds broken / needs a fix","ok"]];opts.forEach(function(pair){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=pair[0];b.addEventListener("click",function(){grade(where,item,pair[1]==="ok",b,"ear")});box.appendChild(b)})}else{prompt.textContent=item.q;const keys=(mode==="sort"||where==="quiz"||learnMode==="mix")?["F","RO","CS","C"]:(learnMode==="fragment"?["F","C"]:learnMode==="runon"?["RO","C"]:["CS","C"]);keys.forEach(function(t){const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=LABEL[t];b.addEventListener("click",function(){grade(where,item,t===item.type,b,"label")});box.appendChild(b)})}}
function grade(where,item,good,btn,kind){if(where==="learn"&&answered)return;if(where==="quiz"&&quizAnswered)return;if(where==="learn")answered=true;else quizAnswered=true;const box=$(where+"Choices");[].forEach.call(box.children,function(b){if(kind==="fix"&&item.type==="C"&&b.textContent==="Already correct")b.classList.add("correct");if(kind==="fix"&&item.type!=="C"&&b.textContent===item.fix)b.classList.add("correct")});const feed=$(where+"Feed");if(good){btn.classList.add("correct");feed.textContent=explain(item);feed.className="feedback good";addXP(where==="quiz"?15:10);if(where==="quiz")quizScore++}else{btn.classList.add("wrong");feed.textContent="This is a "+LABEL[item.type].toLowerCase()+". "+explain(item);feed.className="feedback bad";showHack(where,item.type);if(where==="learn")addXP(2);if(where==="quiz")quizMiss.push({q:item.q,right:LABEL[item.type],why:item.why,fix:item.fix})}$(where+"Next").disabled=false;if(where==="learn")$("learnNext").textContent=learnI===learnItems.length-1?"Done":"Next";if(where==="quiz")$("quizNext").textContent=quizI===quizItems.length-1?"See grade":"Next"}
function learnNext(){if(learnI<learnItems.length-1){learnI++;renderLearn()}else{$("learnBar").style.width="100%";goHome()}}
function startQuiz(){quizItems=shuffle(ITEMS).slice(0,10);quizI=0;quizScore=0;quizMiss=[];quizAnswered=false;show("quiz");renderQuiz()}
function renderQuiz(){const item=quizItems[quizI];$("quizMeta").textContent="Question "+(quizI+1)+" of "+quizItems.length;$("quizBar").style.width=(quizI/quizItems.length*100)+"%";$("quizFeed").textContent="Go.";$("quizFeed").className="feedback";hideHack("quiz");$("quizNext").disabled=true;quizAnswered=false;fillPromptChoices("quiz",item,["label","fix","ear","sort"][quizI%4])}
function quizNext(){if(quizI<quizItems.length-1){quizI++;renderQuiz()}else{$("quizBar").style.width="100%";finishQuiz()}}
function finishQuiz(){const pct=Math.round(quizScore/quizItems.length*100);let letter="F";if(pct>=90)letter="A";else if(pct>=80)letter="B";else if(pct>=70)letter="C";else if(pct>=60)letter="D";$("finalScore").textContent=pct+"%  "+letter;$("finalMsg").textContent=quizScore+" / "+quizItems.length+".";$("missList").innerHTML=quizMiss.length?"<p><b>Missed</b></p>"+quizMiss.map(function(m){return "<div class='ex'><b>"+m.q+"</b><br>"+m.right+". "+m.why+(m.right==="Correct"?"":"<br>Legal version: "+m.fix)+"</div>"}).join(""):"<p>No misses.</p>";addXP(pct>=70?40:10);save.quizzes=(save.quizzes||0)+1;if(pct>(save.bestPct||0))save.bestPct=pct;persist();show("results")}
$("styleGrid").addEventListener("click",function(e){const tile=e.target.closest("[data-style]");if(!tile)return;pickStyle(tile.getAttribute("data-style"))});
$("topicGrid").addEventListener("click",function(e){const tile=e.target.closest("[data-topic]");if(!tile)return;startLearn(tile.getAttribute("data-topic"))});
$("quizBtn").addEventListener("click",startQuiz);
$("learnHome").addEventListener("click",goHome);
$("learnNext").addEventListener("click",learnNext);
$("learnHackBtn").addEventListener("click",function(){toggleHack("learn")});
$("quizQuit").addEventListener("click",goHome);
$("quizNext").addEventListener("click",quizNext);
$("quizHackBtn").addEventListener("click",function(){toggleHack("quiz")});
$("retakeBtn").addEventListener("click",startQuiz);
$("resultsHome").addEventListener("click",goHome);
persist();
</script></body></html>
