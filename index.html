<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sentence Fix — Fragments, Run-Ons & Comma Splices</title>
  <style>
    :root {
      --bg: #0e1117; --panel: #171c26; --panel2: #1e2533; --line: #2a3344;
      --text: #e8edf5; --muted: #9aa6b8; --accent: #7ee0c5; --accent2: #8bb4ff;
      --warn: #ffb86b; --bad: #ff7a8a; --good: #6ee7a8; --gold: #ffd166;
      --shadow: 0 10px 30px rgba(0,0,0,.35); --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(126,224,197,.25); }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 400px at 10% -10%, #1b3a3a 0%, transparent 50%),
        radial-gradient(800px 400px at 110% 0%, #1a2744 0%, transparent 45%),
        var(--bg);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
    header.app { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-weight: 800; color: #0b1220; box-shadow: var(--shadow);
    }
    h1 { font-size: 1.15rem; margin: 0; }
    .sub { color: var(--muted); font-size: .82rem; margin-top: 2px; }
    .xp { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: .85rem; color: var(--gold); }
    .card { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      appearance: none; -webkit-appearance: none; border: 0; cursor: pointer;
      background: #2a3548; color: var(--text); border-radius: 12px; padding: 12px 14px;
      font-size: 1rem; font-family: inherit; touch-action: manipulation;
    }
    button.primary { background: linear-gradient(135deg, #6ee7c3, #7eb6ff); color: #0b1220; font-weight: 800; }
    button.ghost { background: transparent; border: 1px solid var(--line); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
    .tile { text-align: left; padding: 16px; border-radius: 16px; background: #202838; border: 2px solid var(--line); }
    .tile b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
    .tile span { color: var(--muted); font-size: .86rem; display: block; }
    .tile.on { background: #16352f; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .tile.on b::after { content: "  ✓ selected"; color: var(--accent); font-size: .8rem; font-weight: 700; }
    .pill { display: inline-block; font-size: .72rem; letter-spacing: .4px; padding: 3px 8px; border-radius: 999px; background: #243046; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
    .sentence { font-size: 1.15rem; line-height: 1.45; background: #121826; border: 1px dashed #334057; border-radius: 14px; padding: 14px 16px; margin: 12px 0 16px; }
    .choices { display: grid; gap: 8px; }
    .choice { width: 100%; text-align: left; background: #232d3f; border: 1px solid #334057; }
    .choice.correct { background: #173528; border-color: #2f7a55; }
    .choice.wrong { background: #3a1d24; border-color: #8a3a48; }
    .feedback { min-height: 40px; margin-top: 12px; color: var(--muted); font-size: .95rem; line-height: 1.4; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .bar { height: 8px; background: #243044; border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s ease; }
    .stat { color: var(--muted); font-size: .85rem; }
    .score-big { font-size: 3rem; font-weight: 800; margin: 6px 0; }
    .hint { color: var(--muted); font-size: .88rem; margin-top: 10px; }
    .lesson p { margin: 8px 0 12px; line-height: 1.5; color: #d5deea; }
    .ex { background: #121826; border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 10px 10px 0; margin: 8px 0 14px; color: #c9d4e4; }
    footer.note { color: #6e7b90; font-size: .75rem; margin-top: 16px; text-align: center; }
    .hack-btn { margin-top: 10px; width: 100%; background: #2a2416; border: 1px solid #6b5420; color: var(--gold); font-weight: 700; }
    .hack-box { display: none; margin-top: 10px; padding: 12px; background: #1a1710; border: 1px solid #5a4a20; border-radius: 12px; color: #f0e2b8; font-size: .92rem; line-height: 1.45; }
    .hack-box.open { display: block; }
    .persist { color: var(--muted); font-size: .82rem; margin-top: 8px; }
    h3 { margin: 16px 0 8px; font-size: .95rem; color: var(--accent2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="brand">
        <div class="logo">SF</div>
        <div>
          <h1>Sentence Fix</h1>
          <div class="sub">7th grade • same goal, pick your style</div>
        </div>
      </div>
      <div class="xp" id="xp">XP 0</div>
    </header>

    <section id="home" class="card">
      <span class="pill">How do you want to learn?</span>
      <p>Same target: spot fragments, run-ons, and comma splices. Pick a style, then a topic.</p>
      <p class="hint" id="styleNow">Selected style: Label it</p>
      <div class="grid2" id="styleGrid">
        <button type="button" class="tile on" data-style="label"><b>Label it</b><span>Name the error. Fast and quiz-like.</span></button>
        <button type="button" class="tile" data-style="fix"><b>Fix it</b><span>Pick the repaired sentence.</span></button>
        <button type="button" class="tile" data-style="ear"><b>Use your ear</b><span>Does it sound finished? Two sentences or one?</span></button>
        <button type="button" class="tile" data-style="sort"><b>Sort bins</b><span>Tap the bucket it belongs in.</span></button>
      </div>
      <h3>Topic</h3>
      <div class="grid2" id="topicGrid">
        <button type="button" class="tile" data-topic="fragment"><b>Fragments</b><span>Missing a finished thought.</span></button>
        <button type="button" class="tile" data-topic="runon"><b>Run-ons</b><span>Two sentences, no break.</span></button>
        <button type="button" class="tile" data-topic="splice"><b>Comma splices</b><span>Two sentences, only a comma.</span></button>
        <button type="button" class="tile" data-topic="mix"><b>Mixed</b><span>All three, shuffled.</span></button>
      </div>
      <button type="button" class="primary" style="width:100%;margin-top:14px" id="quizBtn">Graded quiz (10 new each time)</button>
      <p class="persist" id="homeStats"></p>
    </section>

    <section id="learn" class="card hidden">
      <div class="stat" id="learnMeta"></div>
      <div class="bar"><i id="learnBar"></i></div>
      <div id="lessonBox" class="lesson"></div>
      <div id="learnPrompt" class="sentence"></div>
      <div id="learnChoices" class="choices"></div>
      <div id="learnFeed" class="feedback"></div>
      <button type="button" class="hack-btn hidden" id="learnHackBtn">Want to know a hack?</button>
      <div class="hack-box" id="learnHackBox"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" class="ghost" id="learnHome">Home</button>
        <button type="button" class="primary" id="learnNext" disabled>Next</button>
      </div>
    </section>

    <section id="quiz" class="card hidden">
      <div class="stat" id="quizMeta"></div>
      <div class="bar"><i id="quizBar"></i></div>
      <div id="quizPrompt" class="sentence"></div>
      <div id="quizChoices" class="choices"></div>
      <div id="quizFeed" class="feedback"></div>
      <button type="button" class="hack-btn hidden" id="quizHackBtn">Want to know a hack?</button>
      <div class="hack-box" id="quizHackBox"></div>
      <div class="row" style="margin-top:12px">
        <button type="button" class="ghost" id="quizQuit">Quit</button>
        <button type="button" class="primary" id="quizNext" disabled>Next</button>
      </div>
    </section>

    <section id="results" class="card hidden">
      <span class="pill">Quiz results</span>
      <div class="score-big" id="finalScore"></div>
      <p id="finalMsg"></p>
      <div id="missList"></div>
      <div class="row" style="margin-top:16px">
        <button type="button" class="primary" id="retakeBtn">New quiz</button>
        <button type="button" class="ghost" id="resultsHome">Home</button>
      </div>
    </section>
    <footer class="note">Open this file in Safari — not the Files preview. Practice tool.</footer>
  </div>

<script>
const ITEMS = [
  {q:"Because the bus was late.",type:"F",why:"Because-clause never finishes.",fix:"Because the bus was late, we missed warm-ups.",ear:"Sounds unfinished."},
  {q:"Running down the sideline with the ball.",type:"F",why:"No subject doing a complete action.",fix:"Jordan was running down the sideline with the ball.",ear:"Who was running?"},
  {q:"When the teacher asked for volunteers.",type:"F",why:"When-clause hanging.",fix:"When the teacher asked for volunteers, Maya raised her hand.",ear:"When… then what?"},
  {q:"After the final bell rang.",type:"F",why:"Dependent clause only.",fix:"After the final bell rang, the hallway filled with noise.",ear:"Unfinished after."},
  {q:"The locker at the end of the hall.",type:"F",why:"Thing named, no verb.",fix:"The locker at the end of the hall is jammed.",ear:"Just a noun pile."},
  {q:"Which made the whole class laugh.",type:"F",why:"Which-clause floating.",fix:"The joke was unexpected, which made the whole class laugh.",ear:"Which what?"},
  {q:"Especially on Friday afternoons.",type:"F",why:"Extra detail, not a sentence.",fix:"The lab is packed, especially on Friday afternoons.",ear:"Only a tag-on."},
  {q:"If we finish the project tonight.",type:"F",why:"If needs a result.",fix:"If we finish the project tonight, we can rest tomorrow.",ear:"If… then what?"},
  {q:"Although she studied for an hour.",type:"F",why:"Although needs a main clause.",fix:"Although she studied for an hour, she still felt nervous.",ear:"Waiting for the rest."},
  {q:"Walking to the cafeteria after science.",type:"F",why:"-ing phrase, no subject+verb pair.",fix:"We were walking to the cafeteria after science.",ear:"Caption, not a sentence."},
  {q:"The reason I stayed after school.",type:"F",why:"No complete verb thought.",fix:"The reason I stayed after school was the robotics meeting.",ear:"The reason… was?"},
  {q:"Such as tacos, pizza, and fruit.",type:"F",why:"Example list with no main sentence.",fix:"He packed a lunch, such as tacos, pizza, and fruit.",ear:"Just a list."},
  {q:"Until the rain stopped.",type:"F",why:"Until-clause incomplete.",fix:"We waited under the awning until the rain stopped.",ear:"Until when—and then?"},
  {q:"My cousin who lives in Austin.",type:"F",why:"Who-clause stuck to a noun, no main verb.",fix:"My cousin who lives in Austin visits in July.",ear:"Needs what the cousin does."},
  {q:"To win the last match of the season.",type:"F",why:"Infinitive phrase only.",fix:"The team practiced to win the last match of the season.",ear:"To win… who?"},
  {q:"While the oven preheated.",type:"F",why:"While-clause alone.",fix:"While the oven preheated, Lila chopped onions.",ear:"While X, Y."},
  {q:"A stack of books on the desk.",type:"F",why:"No verb.",fix:"A stack of books sat on the desk.",ear:"Picture, not a sentence."},
  {q:"Even though the wifi dropped twice.",type:"F",why:"Even though needs a finish.",fix:"Even though the wifi dropped twice, she submitted the file.",ear:"Even though… so?"},
  {q:"Maya finished her essay she submitted it before midnight.",type:"RO",why:"Two sentences, no punctuation.",fix:"Maya finished her essay. She submitted it before midnight.",ear:"Period after essay."},
  {q:"I wanted to stay I had homework.",type:"RO",why:"Two ideas smashed together.",fix:"I wanted to stay, but I had homework.",ear:"Two beats."},
  {q:"The movie ended everyone stayed for the credits.",type:"RO",why:"Needs a break after ended.",fix:"The movie ended, but everyone stayed for the credits.",ear:"Ended. Everyone stayed."},
  {q:"He didn’t hear the announcement he missed the deadline.",type:"RO",why:"Fused sentences.",fix:"He didn’t hear the announcement, so he missed the deadline.",ear:"Two complete thoughts."},
  {q:"The rain started we ran under the awning.",type:"RO",why:"No mark between clauses.",fix:"The rain started. We ran under the awning.",ear:"Started. We ran."},
  {q:"Jordan likes soccer his brother prefers baseball.",type:"RO",why:"Two subject-verb pairs, no break.",fix:"Jordan likes soccer. His brother prefers baseball.",ear:"Two people, two sentences."},
  {q:"The alarm rang nobody moved.",type:"RO",why:"Fused.",fix:"The alarm rang, but nobody moved.",ear:"Rang. Nobody moved."},
  {q:"Sam opened the app the page would not load.",type:"RO",why:"Two sentences glued.",fix:"Sam opened the app, but the page would not load.",ear:"Opened. Would not load."},
  {q:"Practice ran long the bus had already left.",type:"RO",why:"No punctuation.",fix:"Practice ran long, so the bus had already left.",ear:"Long. The bus left."},
  {q:"She texted her mom she needed a ride.",type:"RO",why:"Two full clauses.",fix:"She texted her mom. She needed a ride.",ear:"Texted. Needed."},
  {q:"The test was short I still felt tired.",type:"RO",why:"Fused.",fix:"The test was short, yet I still felt tired.",ear:"Short. Still tired."},
  {q:"Turn left at the light keep going two blocks.",type:"RO",why:"Two commands smashed.",fix:"Turn left at the light. Keep going two blocks.",ear:"Two directions."},
  {q:"My phone died I used the library computer.",type:"RO",why:"No stop.",fix:"My phone died, so I used the library computer.",ear:"Died. I used."},
  {q:"The soup boiled over someone grabbed a towel.",type:"RO",why:"Two events, no break.",fix:"The soup boiled over. Someone grabbed a towel.",ear:"Two snapshots."},
  {q:"The storm knocked out power, we used flashlights.",type:"CS",why:"Comma alone cannot join sentences.",fix:"The storm knocked out power, so we used flashlights.",ear:"Two sentences, only a comma."},
  {q:"The recipe looked simple, it took two hours.",type:"CS",why:"Comma splice.",fix:"The recipe looked simple, but it took two hours.",ear:"Simple. It took."},
  {q:"Lila packed her bag, she forgot her charger.",type:"CS",why:"Two sentences, only a comma.",fix:"Lila packed her bag, but she forgot her charger.",ear:"Packed. Forgot."},
  {q:"The library closes at six, however the lab stays open.",type:"CS",why:"However is not FANBOYS.",fix:"The library closes at six; however, the lab stays open.",ear:"However does not fix a comma."},
  {q:"I like tacos, they are easy to make.",type:"CS",why:"Comma splice.",fix:"I like tacos. They are easy to make.",ear:"Two complete sentences."},
  {q:"She practiced every day, her serve got stronger.",type:"CS",why:"Need and/so/period.",fix:"She practiced every day, so her serve got stronger.",ear:"Practiced. Serve got stronger."},
  {q:"The hallway was loud, nobody could hear the announcement.",type:"CS",why:"Comma only.",fix:"The hallway was loud, so nobody could hear the announcement.",ear:"Loud. Nobody could hear."},
  {q:"Bring a pencil, you will need one for the map.",type:"CS",why:"Two statements, comma only.",fix:"Bring a pencil. You will need one for the map.",ear:"Bring. You will need."},
  {q:"It started to hail, we pulled under a bridge.",type:"CS",why:"Comma splice.",fix:"It started to hail, and we pulled under a bridge.",ear:"Hail. We pulled."},
  {q:"The quiz is tomorrow, therefore I am reviewing tonight.",type:"CS",why:"Therefore is not FANBOYS.",fix:"The quiz is tomorrow; therefore, I am reviewing tonight.",ear:"Therefore needs a semicolon."},
  {q:"Mom called twice, I still missed it.",type:"CS",why:"Comma only.",fix:"Mom called twice, but I still missed it.",ear:"Called. I missed."},
  {q:"The gym was locked, then we practiced outside.",type:"CS",why:"Then is not FANBOYS.",fix:"The gym was locked. Then we practiced outside.",ear:"Then does not save a splice."},
  {q:"He is a great passer, he rarely shoots.",type:"CS",why:"Two sentences.",fix:"He is a great passer, yet he rarely shoots.",ear:"Passer. Rarely shoots."},
  {q:"Dinner is ready, come to the table.",type:"CS",why:"Two sentences joined by a comma.",fix:"Dinner is ready. Come to the table.",ear:"Ready. Come."},
  {q:"After the final bell rang, the hallway filled with noise.",type:"C",why:"Dependent clause + complete sentence.",fix:"After the final bell rang, the hallway filled with noise.",ear:"Sounds finished."},
  {q:"Jordan likes soccer. His brother prefers baseball.",type:"C",why:"Two clean sentences.",fix:"Jordan likes soccer. His brother prefers baseball.",ear:"Two clean stops."},
  {q:"The dog barked, and the cat hid under the couch.",type:"C",why:"Comma + and (FANBOYS) is legal.",fix:"The dog barked, and the cat hid under the couch.",ear:"And legally joins them."},
  {q:"Although she studied, she still felt nervous.",type:"C",why:"Although attached to a full sentence.",fix:"Although she studied, she still felt nervous.",ear:"Complete."},
  {q:"We can leave now, or we can wait for Sam.",type:"C",why:"Comma + or.",fix:"We can leave now, or we can wait for Sam.",ear:"Legal choice pair."},
  {q:"The joke was unexpected, which made the class laugh.",type:"C",why:"Which-clause is attached.",fix:"The joke was unexpected, which made the class laugh.",ear:"Attached which is fine."},
  {q:"Because the bus was late, we missed warm-ups.",type:"C",why:"Because plus a result.",fix:"Because the bus was late, we missed warm-ups.",ear:"Finished thought."},
  {q:"The soup boiled over. Someone grabbed a towel.",type:"C",why:"Period split.",fix:"The soup boiled over. Someone grabbed a towel.",ear:"Two clean beats."},
  {q:"She packed her bag, but she forgot her charger.",type:"C",why:"Comma + but.",fix:"She packed her bag, but she forgot her charger.",ear:"But is FANBOYS."},
  {q:"If we finish tonight, we can rest tomorrow.",type:"C",why:"If + result.",fix:"If we finish tonight, we can rest tomorrow.",ear:"Complete pair."},
  {q:"The library closes at six; the lab stays open.",type:"C",why:"Semicolon joins two sentences.",fix:"The library closes at six; the lab stays open.",ear:"Semicolon is legal."},
  {q:"Bring a pencil. You will need one for the map.",type:"C",why:"Period between sentences.",fix:"Bring a pencil. You will need one for the map.",ear:"Split cleanly."}
];

const LESSONS = {
  fragment:{title:"Fragments",html:"<p>A <b>fragment</b> is missing a subject, a verb, or a finished thought.</p>"},
  runon:{title:"Run-ons",html:"<p>A <b>run-on</b> slams two complete sentences together with <b>no</b> punctuation.</p>"},
  splice:{title:"Comma splices",html:"<p>A <b>comma splice</b> joins two sentences with <b>only a comma</b>. however / therefore / then are not FANBOYS.</p>"},
  mix:{title:"Mixed",html:"<p><b>F</b> fragment • <b>RO</b> run-on • <b>CS</b> comma splice • <b>C</b> correct</p>"}
};
const LABEL = { F:"Fragment", RO:"Run-on", CS:"Comma splice", C:"Correct" };
const HACKS = {
  F:"<b>Hack:</b> Read it out loud. If it feels unfinished, it is a fragment.",
  RO:"<b>Hack:</b> Find two spots that could take a period. If nothing sits between those sentences, it is a run-on.",
  CS:"<b>Hack:</b> Cover the comma. If both sides are full sentences, a comma alone is illegal.",
  C:"<b>Hack:</b> Legal: period • semicolon • comma + FANBOYS (for and nor but or yet so) • hanger word attached to a full sentence."
};
const STORE = "sentenceFixSave_v2";
let save = { xp:0, bestPct:0, quizzes:0 };
try { const raw = localStorage.getItem(STORE); if(raw) save = Object.assign(save, JSON.parse(raw)); } catch(e){}
let xp = save.xp || 0;
let style = "label";
let learnItems=[], learnI=0, learnMode="fragment", answered=false;
let quizItems=[], quizI=0, quizScore=0, quizMiss=[], quizAnswered=false;

function $(id){ return document.getElementById(id); }
function show(id){ ["home","learn","quiz","results"].forEach(s => $(s).classList.add("hidden")); $(id).classList.remove("hidden"); }
function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function persist(){
  save.xp = xp;
  try { localStorage.setItem(STORE, JSON.stringify(save)); } catch(e){}
  $("xp").textContent = "XP " + xp;
  const el = $("homeStats");
  if(el) el.textContent = save.quizzes
    ? "Saved on this phone • Best quiz: "+save.bestPct+"% • Quizzes: "+save.quizzes
    : "XP and best quiz save on this phone (Safari).";
}
function addXP(n){ xp += n; persist(); }
function goHome(){ persist(); show("home"); }
function styleName(){ return {label:"Label it",fix:"Fix it",ear:"Use your ear",sort:"Sort bins"}[style]; }
function pickStyle(s){
  style = s;
  document.querySelectorAll("#styleGrid .tile").forEach(t => {
    t.classList.toggle("on", t.getAttribute("data-style") === s);
  });
  $("styleNow").textContent = "Selected style: " + styleName();
}
function toggleHack(w){ $(w+"HackBox").classList.toggle("open"); }
function showHack(w,t){ $(w+"HackBtn").classList.remove("hidden"); $(w+"HackBox").className="hack-box"; $(w+"HackBox").innerHTML=HACKS[t]; }
function hideHack(w){ $(w+"HackBtn").classList.add("hidden"); $(w+"HackBox").className="hack-box"; $(w+"HackBox").innerHTML=""; }
function byType(t){ return ITEMS.filter(i => i.type===t); }
function poolFor(mode){
  if(mode==="mix") return ITEMS.slice();
  return [...byType(mode==="fragment"?"F":mode==="runon"?"RO":"CS"), ...byType("C")];
}
function distractorFixes(item){
  const others = shuffle(ITEMS.filter(i => i.fix!==item.fix)).slice(0,2).map(i=>i.fix);
  return shuffle([item.fix, ...others]);
}

function startLearn(mode){
  learnMode = mode; answered=false;
  learnItems = shuffle(poolFor(mode)).slice(0,8);
  learnI=0;
  $("lessonBox").innerHTML = "<h2 style='margin:0 0 6px'>"+LESSONS[mode].title+"</h2>"+LESSONS[mode].html+"<p class='hint'>Style: "+styleName()+"</p>";
  show("learn"); renderLearn();
}
function renderLearn(){
  const item = learnItems[learnI];
  $("learnMeta").textContent = "Round "+(learnI+1)+" of "+learnItems.length;
  $("learnBar").style.width = (learnI/learnItems.length*100)+"%";
  $("learnFeed").textContent=""; $("learnFeed").className="feedback";
  hideHack("learn"); $("learnNext").disabled=true; answered=false;
  fillPromptChoices("learn", item, style);
}
function fillPromptChoices(where, item, mode){
  const prompt = $(where+"Prompt");
  const box = $(where+"Choices");
  box.innerHTML="";
  if(mode==="fix"){
    prompt.textContent = "Fix this: " + item.q;
    distractorFixes(item).forEach(txt => {
      const b=document.createElement("button"); b.type="button"; b.className="choice"; b.textContent=txt;
      b.addEventListener("click", function(){ grade(where, item, txt===item.fix, b, "fix"); });
      box.appendChild(b);
    });
  } else if(mode==="ear"){
    prompt.textContent = "Listen in your head: “" + item.q + "”";
    const opts = item.type==="C"
      ? [["Sounds finished / legal","ok"],["Sounds broken","bad"]]
      : [["Sounds finished / legal","bad"],["Sounds broken / needs a fix","ok"]];
    opts.forEach(function(pair){
      const b=document.createElement("button"); b.type="button"; b.className="choice"; b.textContent=pair[0];
      b.addEventListener("click", function(){ grade(where, item, pair[1]==="ok", b, "ear"); });
      box.appendChild(b);
    });
  } else {
    prompt.textContent = item.q;
    const keys = (mode==="sort" || where==="quiz" || learnMode==="mix") ? ["F","RO","CS","C"]
      : (learnMode==="fragment"?["F","C"]:learnMode==="runon"?["RO","C"]:["CS","C"]);
    keys.forEach(function(t){
      const b=document.createElement("button"); b.type="button"; b.className="choice"; b.textContent=LABEL[t];
      b.addEventListener("click", function(){ grade(where, item, t===item.type, b, "label"); });
      box.appendChild(b);
    });
  }
}
function grade(where, item, good, btn, kind){
  if(where==="learn" && answered) return;
  if(where==="quiz" && quizAnswered) return;
  if(where==="learn") answered=true; else quizAnswered=true;
  const box = $(where+"Choices");
  [].forEach.call(box.children, function(b){
    if(kind==="fix" && b.textContent===item.fix) b.classList.add("correct");
  });
  const feed = $(where+"Feed");
  if(good){
    btn.classList.add("correct");
    feed.textContent = (kind==="ear"?item.ear+" ":"") + item.why + (kind==="fix"?"":"  Fix: "+item.fix);
    feed.className="feedback good";
    addXP(where==="quiz"?15:10);
    if(where==="quiz") quizScore++;
  } else {
    btn.classList.add("wrong");
    feed.textContent = "This is a "+LABEL[item.type].toLowerCase()+". "+item.why+" Fix: "+item.fix;
    feed.className="feedback bad";
    showHack(where, item.type);
    if(where==="learn") addXP(2);
    if(where==="quiz") quizMiss.push({q:item.q,right:LABEL[item.type],why:item.why,fix:item.fix});
  }
  $(where+"Next").disabled=false;
  if(where==="learn") $("learnNext").textContent = learnI===learnItems.length-1 ? "Done" : "Next";
  if(where==="quiz") $("quizNext").textContent = quizI===quizItems.length-1 ? "See grade" : "Next";
}
function learnNext(){
  if(learnI<learnItems.length-1){ learnI++; renderLearn(); }
  else { $("learnBar").style.width="100%"; goHome(); }
}
function startQuiz(){
  quizItems = shuffle(ITEMS).slice(0,10);
  quizI=0; quizScore=0; quizMiss=[]; quizAnswered=false;
  show("quiz"); renderQuiz();
}
function renderQuiz(){
  const item=quizItems[quizI];
  $("quizMeta").textContent="Question "+(quizI+1)+" of "+quizItems.length+" • mixed styles";
  $("quizBar").style.width=(quizI/quizItems.length*100)+"%";
  $("quizFeed").textContent="Go."; $("quizFeed").className="feedback";
  hideHack("quiz"); $("quizNext").disabled=true; quizAnswered=false;
  const modes=["label","fix","ear","sort"];
  fillPromptChoices("quiz", item, modes[quizI % 4]);
}
function quizNext(){
  if(quizI<quizItems.length-1){ quizI++; renderQuiz(); }
  else { $("quizBar").style.width="100%"; finishQuiz(); }
}
function finishQuiz(){
  const pct=Math.round(quizScore/quizItems.length*100);
  let letter="F"; if(pct>=90)letter="A"; else if(pct>=80)letter="B"; else if(pct>=70)letter="C"; else if(pct>=60)letter="D";
  $("finalScore").textContent=pct+"%  "+letter;
  $("finalMsg").textContent=quizScore+" / "+quizItems.length+".";
  $("missList").innerHTML = quizMiss.length
    ? "<p><b>Missed</b></p>"+quizMiss.map(function(m){ return "<div class='ex'><b>"+m.q+"</b><br>"+m.right+". "+m.why+"<br>Fix: "+m.fix+"</div>"; }).join("")
    : "<p>No misses.</p>";
  addXP(pct>=70?40:10);
  save.quizzes=(save.quizzes||0)+1;
  if(pct>(save.bestPct||0)) save.bestPct=pct;
  persist(); show("results");
}

$("styleGrid").addEventListener("click", function(e){
  const tile = e.target.closest("[data-style]");
  if(!tile) return;
  pickStyle(tile.getAttribute("data-style"));
});
$("topicGrid").addEventListener("click", function(e){
  const tile = e.target.closest("[data-topic]");
  if(!tile) return;
  startLearn(tile.getAttribute("data-topic"));
});
$("quizBtn").addEventListener("click", startQuiz);
$("learnHome").addEventListener("click", goHome);
$("learnNext").addEventListener("click", learnNext);
$("learnHackBtn").addEventListener("click", function(){ toggleHack("learn"); });
$("quizQuit").addEventListener("click", goHome);
$("quizNext").addEventListener("click", quizNext);
$("quizHackBtn").addEventListener("click", function(){ toggleHack("quiz"); });
$("retakeBtn").addEventListener("click", startQuiz);
$("resultsHome").addEventListener("click", goHome);
persist();
</script>
</body>
</html>
